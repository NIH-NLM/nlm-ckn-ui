name: PR Preview Deploy

# Deploy half of the PR preview (see preview.yml for the overall split). Runs
# when a "PR Preview" build run completes, and, as a workflow_run workflow,
# always from main's copy of this file: a PR cannot change what runs here.
# Runs as the preview CI role in the `preview` environment (restricted to main),
# which the role's OIDC trust requires.
#
# Treats the build run as untrusted: it loads and pushes the image and syncs
# the frontend files from its artifacts, but checks out no code and executes
# nothing from them. The head SHA is the build run's own (GitHub metadata) and
# the PR number is looked up from the GitHub API, never read from an artifact.
#
# The CI role (nlm-ckn-dev-preview-ci) may only create change sets from the
# published preview-pr.yaml under the preview service role, and may push only
# to the preview ECR repo (nlm-ckn-dev-preview-backend; immutable tags, images
# expire after 7 days). It cannot read the platform stack's outputs, hence:
#
# Required `preview` environment variables:
#   PREVIEW_CI_ROLE_ARN       PreviewCiRoleArn
#   PREVIEW_SERVICE_ROLE_ARN  PreviewServiceRoleArn
#   PREVIEW_BUCKET            PreviewBucketName
#   PREVIEW_DISTRIBUTION_ID   PreviewDistributionId

on:
  workflow_run: # zizmor: ignore[dangerous-triggers] checks out no code; artifacts are data only, PR found via API
    # Must match preview.yml's `name`.
    workflows: [PR Preview]
    types: [completed]

permissions: {}

env:
  AWS_REGION: us-east-1
  SSM_TEMPLATE_URL: /nlm-ckn/dev/preview/pr-template-url
  ECR_REPOSITORY: nlm-ckn-dev-preview-backend
  COMMENT_MARKER: '<!-- nlm-ckn-preview -->'

jobs:
  # Finds the PR the build was for. No environment and no AWS access, so runs
  # with nothing to deploy (a skipped build, a fork, a PR no longer labelled)
  # end here without taking the per-PR concurrency group.
  resolve:
    name: Resolve PR
    if: >-
      github.event.workflow_run.event == 'pull_request' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_repository.full_name == github.repository
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
      actions: read
    outputs:
      deploy: ${{ steps.find.outputs.deploy }}
      pr-number: ${{ steps.find.outputs.pr-number }}
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
    steps:
      - id: find
        run: |
          set -euo pipefail
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head-sha"; exit 1; }
          # An open same-repo PR at exactly this head, still labelled.
          prs=$(gh api "repos/${GITHUB_REPOSITORY}/commits/${HEAD_SHA}/pulls" --jq \
            "[.[] | select(.state == \"open\" and .head.sha == \"${HEAD_SHA}\"
              and .head.repo.full_name == \"${GITHUB_REPOSITORY}\"
              and ([.labels[].name] | index(\"preview\") != null)) | .number]")
          echo "Labelled open PRs at ${HEAD_SHA::7}: ${prs}"
          if [ "$(jq length <<<"$prs")" != 1 ]; then
            echo "::notice::No single labelled open PR at ${HEAD_SHA::7}; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The build job is skipped (and uploads nothing) when its state check
          # found the PR stale, yet the run still succeeds.
          has=$(gh api "repos/${GITHUB_REPOSITORY}/actions/runs/${BUILD_RUN_ID}/artifacts" --jq \
            '[.artifacts[] | select(.expired | not) | .name] | (index("preview-backend-image") != null and index("preview-frontend") != null)')
          if [ "$has" != true ]; then
            echo "::notice::Build run ${BUILD_RUN_ID} uploaded no preview artifacts; nothing to deploy."
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "deploy=true" >> "$GITHUB_OUTPUT"
          echo "pr-number=$(jq '.[0]' <<<"$prs")" >> "$GITHUB_OUTPUT"

  deploy:
    name: Deploy preview
    needs: resolve
    if: needs.resolve.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    environment: preview
    # Shared with preview-teardown.yml: one preview operation per PR at a time,
    # never cancelled mid-flight (a cancelled stack update leaves a half-done
    # stack). A newer pending run replaces an older pending one; the recheck
    # below and the expiry reconciliation make either order safe.
    concurrency:
      group: preview-pr-${{ needs.resolve.outputs.pr-number }}
      cancel-in-progress: false
    permissions:
      id-token: write
      contents: read
      pull-requests: write
      issues: read
      actions: read
    env:
      GH_TOKEN: ${{ github.token }}
      PR_NUMBER: ${{ needs.resolve.outputs.pr-number }}
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      BUILD_RUN_ID: ${{ github.event.workflow_run.id }}
      STACK_NAME: nlm-ckn-preview-pr-${{ needs.resolve.outputs.pr-number }}

    steps:
      # Everything below interpolates these into resource names and commands.
      # PR_NUMBER came from the API, but check it like the rest anyway.
      - name: Validate inputs
        run: |
          set -euo pipefail
          [[ "$PR_NUMBER" =~ ^[1-9][0-9]{0,3}$ ]] || { echo "::error::bad pr-number"; exit 1; }
          [[ "$HEAD_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::bad head-sha"; exit 1; }
          [[ "$BUILD_RUN_ID" =~ ^[0-9]+$ ]] || { echo "::error::bad build-run-id"; exit 1; }

      # Checked again once this job holds the concurrency group (it may have
      # queued behind another run) and on every re-run of it: the label may
      # have been removed, the PR closed (and torn down) or a newer commit
      # pushed since resolve. Skip rather than fail, so nothing is redeployed
      # and no failure comment is posted.
      - name: Recheck PR state
        id: pr
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq \
            "(.state == \"open\" and .head.sha == \"${HEAD_SHA}\" and ([.labels[].name] | index(\"preview\") != null))")
          echo "Current: ${current}"
          if [ "$current" != true ]; then
            echo "::notice::PR #${PR_NUMBER} is closed, unlabelled or past ${HEAD_SHA::7}; skipping deploy."
          fi
          echo "current=${current}" >> "$GITHUB_OUTPUT"

      # Cross-run download from the build run: needs the token and actions: read.
      - name: Download build artifacts
        if: steps.pr.outputs.current == 'true'
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: preview-*
          path: artifacts
          run-id: ${{ github.event.workflow_run.id }}
          github-token: ${{ github.token }}

      - name: Configure AWS credentials via OIDC
        if: steps.pr.outputs.current == 'true'
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PREVIEW_CI_ROLE_ARN }}
          role-session-name: preview-pr-${{ needs.resolve.outputs.pr-number }}
          aws-region: us-east-1

      - name: Log in to Amazon ECR
        if: steps.pr.outputs.current == 'true'
        id: ecr
        uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      # Tags are immutable, so a tag already pushed (re-run, or a re-label with
      # no new commits) is reused rather than pushed again.
      - name: Push backend image
        if: steps.pr.outputs.current == 'true'
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          set -euo pipefail
          tag="pr-${PR_NUMBER}-${HEAD_SHA::7}"
          uri="${REGISTRY}/${ECR_REPOSITORY}:${tag}"
          if aws ecr describe-images --repository-name "$ECR_REPOSITORY" \
              --image-ids imageTag="$tag" >/dev/null 2>&1; then
            echo "${uri} already exists; skipping push."
          else
            docker load -i artifacts/preview-backend-image/backend-image.tar.gz
            docker tag preview-backend "$uri"
            docker push "$uri"
          fi
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      # CREATE for a new stack (fresh ExpiresAt = now + 3 days), UPDATE for a
      # live one (its existing ExpiresAt is passed back so pushes do not extend
      # it). A stack left in ROLLBACK_COMPLETE etc. cannot be updated and is
      # deleted first.
      #
      # Except: a preview label added (or the PR reopened) since the live
      # stack's 3-day window began promises a fresh 3 days. That happens when
      # the re-label's deploy replaced a teardown still queued behind a
      # running deploy, so the stack was never deleted.
      - name: Inspect preview stack
        if: steps.pr.outputs.current == 'true'
        id: stack
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
          echo "Stack status: ${status}"

          case "$status" in
            ROLLBACK_COMPLETE|ROLLBACK_FAILED|DELETE_FAILED|DELETE_IN_PROGRESS)
              if [ "$status" != DELETE_IN_PROGRESS ]; then
                aws cloudformation delete-stack --stack-name "$STACK_NAME"
              fi
              aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"
              status=NONE
              ;;
            *_IN_PROGRESS)
              if [ "$status" != REVIEW_IN_PROGRESS ]; then
                echo "::error::${STACK_NAME} is ${status}; re-run once it settles"
                exit 1
              fi
              ;;
          esac

          if [ "$status" = NONE ] || [ "$status" = REVIEW_IN_PROGRESS ]; then
            type=CREATE
            expires=$(date -u -d '+3 days' +%Y-%m-%dT%H:%M:%SZ)
          else
            type=UPDATE
            expires=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
              --query "Stacks[0].Tags[?Key=='ExpiresAt'].Value | [0]" --output text)
            if [ -z "$expires" ] || [ "$expires" = None ]; then
              expires=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
                --query "Stacks[0].Parameters[?ParameterKey=='ExpiresAt'].ParameterValue | [0]" --output text)
            fi
            # An unreadable expiry counts as a window starting at the epoch,
            # so any label event refreshes it.
            window_start=$(( $(date -u -d "$expires" +%s 2>/dev/null || echo 0) - 3 * 86400 ))
            last_wanted=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/events" --jq \
              '.[] | select((.event == "labeled" and .label.name == "preview") or .event == "reopened") | .created_at' \
              | sort | tail -n1)
            echo "Window start: $(date -u -d "@${window_start}" +%Y-%m-%dT%H:%M:%SZ); last label/reopen: ${last_wanted:-none}"
            if [ -n "$last_wanted" ] && [ "$(date -u -d "$last_wanted" +%s)" -gt "$window_start" ]; then
              echo "Re-labelled since this preview's window began; starting a fresh 3 days."
              expires=$(date -u -d '+3 days' +%Y-%m-%dT%H:%M:%SZ)
            fi
          fi
          echo "Change set type: ${type}; ExpiresAt: ${expires}"
          echo "type=${type}" >> "$GITHUB_OUTPUT"
          echo "expires=${expires}" >> "$GITHUB_OUTPUT"

      # `aws cloudformation deploy` is refused: it sends the template inline,
      # and the CI role may only create change sets whose TemplateURL is the
      # published preview-pr.yaml.
      - name: Deploy backend stack
        if: steps.pr.outputs.current == 'true'
        env:
          SERVICE_ROLE_ARN: ${{ vars.PREVIEW_SERVICE_ROLE_ARN }}
          CHANGE_SET_TYPE: ${{ steps.stack.outputs.type }}
          EXPIRES_AT: ${{ steps.stack.outputs.expires }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
        run: |
          set -euo pipefail
          template_url=$(aws ssm get-parameter --name "$SSM_TEMPLATE_URL" \
            --query Parameter.Value --output text)
          echo "Template: ${template_url}"
          change_set="pr-${PR_NUMBER}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"

          aws cloudformation create-change-set \
            --stack-name "$STACK_NAME" \
            --change-set-name "$change_set" \
            --change-set-type "$CHANGE_SET_TYPE" \
            --template-url "$template_url" \
            --role-arn "$SERVICE_ROLE_ARN" \
            --parameters \
              ParameterKey=PrNumber,ParameterValue="$PR_NUMBER" \
              ParameterKey=ImageTag,ParameterValue="$IMAGE_TAG" \
              ParameterKey=ExpiresAt,ParameterValue="$EXPIRES_AT" \
            --tags \
              Key=Project,Value=nlm-ckn \
              Key=Environment,Value=dev \
              Key=ManagedBy,Value=CloudFormation \
              Key=Owner,Value=springbok \
              Key=Repository,Value=nlm-ckn-ui \
              Key=PrNumber,Value="$PR_NUMBER" \
              Key=ExpiresAt,Value="$EXPIRES_AT" \
            >/dev/null

          if ! aws cloudformation wait change-set-create-complete \
              --stack-name "$STACK_NAME" --change-set-name "$change_set"; then
            reason=$(aws cloudformation describe-change-set --stack-name "$STACK_NAME" \
              --change-set-name "$change_set" --query StatusReason --output text)
            aws cloudformation delete-change-set --stack-name "$STACK_NAME" --change-set-name "$change_set"
            if grep -qE "didn't contain changes|No updates are to be performed" <<<"$reason"; then
              echo "No backend changes; stack is already up to date."
              exit 0
            fi
            echo "::error::Change set failed: ${reason}"
            exit 1
          fi

          aws cloudformation execute-change-set \
            --stack-name "$STACK_NAME" --change-set-name "$change_set"
          if [ "$CHANGE_SET_TYPE" = CREATE ]; then
            waiter=stack-create-complete
          else
            waiter=stack-update-complete
          fi
          if ! aws cloudformation wait "$waiter" --stack-name "$STACK_NAME"; then
            echo "::error::${STACK_NAME} did not reach ${waiter}"
            aws cloudformation describe-stack-events --stack-name "$STACK_NAME" --max-items 40 \
              --query "StackEvents[?contains(ResourceStatus, 'FAILED')].[Timestamp,LogicalResourceId,ResourceStatus,ResourceStatusReason]" \
              --output table
            exit 1
          fi

      - name: Read preview URL
        if: steps.pr.outputs.current == 'true'
        id: url
        run: |
          set -euo pipefail
          url=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query "Stacks[0].Outputs[?OutputKey=='PreviewUrl'].OutputValue | [0]" --output text)
          echo "Preview URL: ${url}"
          echo "url=${url}" >> "$GITHUB_OUTPUT"


      - name: Upload frontend and invalidate
        if: steps.pr.outputs.current == 'true'
        env:
          PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
          PREVIEW_DISTRIBUTION_ID: ${{ vars.PREVIEW_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 sync artifacts/preview-frontend/ "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/" --delete --no-progress
          # The router rewrites the URI before the cache lookup, so cached keys
          # are /pr-<n>/... rather than the viewer's path.
          aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION_ID" \
            --paths "/pr-${PR_NUMBER}/*" --query 'Invalidation.Id' --output text

      - name: Comment preview URL
        if: steps.pr.outputs.current == 'true'
        env:
          PREVIEW_URL: ${{ steps.url.outputs.url }}
          IMAGE_TAG: ${{ steps.image.outputs.tag }}
          EXPIRES_AT: ${{ steps.stack.outputs.expires }}
        run: |
          set -euo pipefail
          body="${COMMENT_MARKER}
          ### PR preview

          **${PREVIEW_URL}**

          Sign in (needs AWS access; the printed link can be shared): \`AWS_PROFILE=springbok ./scripts/ops/preview-login.sh ${PR_NUMBER}\`

          | | |
          |---|---|
          | Frontend | \`${HEAD_SHA::7}\` |
          | Backend image | \`${IMAGE_TAG}\` |
          | Expires | ${EXPIRES_AT} |

          Pushes redeploy it. Remove the \`preview\` label to tear it down (re-adding it starts a fresh 3-day preview)."
          # One comment per PR, found by its marker and updated in place.
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\")))][0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

      - name: Comment failure
        if: failure()
        run: |
          set -euo pipefail
          body="${COMMENT_MARKER}
          ### PR preview

          Deploy of \`${HEAD_SHA::7}\` failed — see [the run](${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID})."
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\")))][0].id // empty" | head -n1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
          else
            gh api -X POST "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" -f body="$body" >/dev/null
          fi

