name: PR Preview

# Ephemeral per-PR preview at https://pr-<n>.dev.nlm-ckn.org (signed-cookie
# sign-in via scripts/ops/preview-login.sh).
#
# A maintainer adds the `preview` label → deploy; every push while labelled →
# redeploy. Teardown (label removed / PR closed) is preview-teardown.yml. The
# nlm-ckn-iac sweeper deletes any preview past its ExpiresAt (3 days after
# creation), so there is no sweep job.
#
# Split so PR code never runs next to AWS credentials:
#   build   — this workflow (pull_request, the PR's own YAML), no AWS access:
#             builds the backend image and the frontend from the PR head and
#             uploads them as artifacts.
#   deploy  — preview-deploy.yml, a workflow_run workflow, so it always runs
#             main's YAML, in the `preview` environment (restricted to main):
#             downloads those artifacts and pushes/deploys them. It checks out
#             nothing and runs nothing from the artifacts.
#   teardown — preview-teardown.yml (pull_request_target, main's YAML).
#
# preview-deploy.yml triggers on this workflow's `name`; keep them in sync.

on:
  pull_request:
    types: [labeled, synchronize, reopened]

# Builds touch no AWS state, so a newer build for the PR cancels an older one
# (its cancelled run then deploys nothing). Runs that will skip (the condition
# mirrors the `state` job's `if`) get their own group so they cannot cancel a
# real build. Deploys and teardowns serialize on preview-pr-<n> instead.
concurrency:
  group: >-
    ${{ (github.event.pull_request.head.repo.full_name == github.repository &&
    contains(github.event.pull_request.labels.*.name, 'preview') &&
    (github.event.action != 'labeled' || github.event.label.name == 'preview'))
    && format('preview-build-pr-{0}', github.event.pull_request.number)
    || format('preview-noop-{0}', github.run_id) }}
  cancel-in-progress: true

permissions: {}

jobs:
  state:
    name: Check PR state
    # Same-repo PRs only. `labeled` builds only for the preview label itself.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      contains(github.event.pull_request.labels.*.name, 'preview') &&
      (github.event.action != 'labeled' || github.event.label.name == 'preview')
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read
    outputs:
      current: ${{ steps.check.outputs.current }}
    steps:
      # Build only if the PR is still open, labelled and at this run's head
      # (otherwise a newer run follows). preview-deploy.yml checks again.
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          current=$(gh api "repos/${GITHUB_REPOSITORY}/pulls/${PR_NUMBER}" --jq \
            "(.state == \"open\" and .head.sha == \"${HEAD_SHA}\" and ([.labels[].name] | index(\"preview\") != null))")
          echo "Current: ${current}"
          echo "current=${current}" >> "$GITHUB_OUTPUT"

  build:
    name: Build preview
    needs: state
    if: needs.state.outputs.current == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      HEAD_SHA: ${{ github.event.pull_request.head.sha }}
      PR_NUMBER: ${{ github.event.pull_request.number }}

    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      # As scripts/app/deploy-backend.sh builds dev's image. UI_VERSION matches
      # the tag preview-deploy.yml pushes it under.
      - name: Build backend image
        run: |
          set -euo pipefail
          docker build --platform linux/amd64 \
            --build-arg UI_VERSION="pr-${PR_NUMBER}-${HEAD_SHA::7}" -t preview-backend .
          docker save preview-backend | gzip > backend-image.tar.gz
          ls -lh backend-image.tar.gz

      - name: Upload backend image
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-backend-image
          path: backend-image.tar.gz
          compression-level: 0
          retention-days: 1
          if-no-files-found: error

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'react/package-lock.json'

      # Mirrors scripts/app/deploy-frontend.sh's build. The router CloudFront
      # Function maps pr-<n>.<domain>/... onto the pr-<n>/ prefix, so the build
      # is served from / and needs no PUBLIC_URL.
      - name: Build frontend
        working-directory: react
        run: |
          set -euo pipefail
          npm ci --prefer-offline --no-audit
          REACT_APP_VERSION="pr-${PR_NUMBER}-${HEAD_SHA::7}" npm run build-react

      - name: Upload frontend
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: preview-frontend
          path: react/build/
          retention-days: 1
          if-no-files-found: error
