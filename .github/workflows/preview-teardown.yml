name: PR Preview Teardown

# Deletes a PR's preview stack and frontend when the PR closes or loses the
# `preview` label. Checks out no code. STEP 2 switches the trigger to
# pull_request_target so this runs main's YAML (see preview.yml).

on:
  pull_request:
    types: [unlabeled, closed]

# Same group as preview.yml, so a teardown waits for an in-flight deploy.
concurrency:
  group: preview-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: false

permissions: {}

env:
  AWS_REGION: us-east-1
  PR_NUMBER: ${{ github.event.pull_request.number }}
  STACK_NAME: nlm-ckn-preview-pr-${{ github.event.pull_request.number }}
  COMMENT_MARKER: '<!-- nlm-ckn-preview -->'

jobs:
  teardown:
    name: Tear down preview
    # `closed` only matters if the PR still had a preview; `unlabeled` only for
    # the preview label. Gating on the label keeps unrelated closes from
    # queueing a `preview` environment approval.
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      (
        (github.event.action == 'closed' && contains(github.event.pull_request.labels.*.name, 'preview')) ||
        (github.event.action == 'unlabeled' && github.event.label.name == 'preview')
      )
    runs-on: ubuntu-latest
    environment: preview
    permissions:
      id-token: write
      contents: read
      pull-requests: write
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4
        with:
          role-to-assume: ${{ vars.PREVIEW_CI_ROLE_ARN }}
          role-session-name: preview-pr-${{ github.event.pull_request.number }}
          aws-region: us-east-1

      - name: Delete preview stack
        run: |
          set -euo pipefail
          status=$(aws cloudformation describe-stacks --stack-name "$STACK_NAME" \
            --query 'Stacks[0].StackStatus' --output text 2>/dev/null || echo NONE)
          echo "Stack status: ${status}"
          if [ "$status" = NONE ]; then
            echo "No stack to delete."
            exit 0
          fi
          if [ "$status" != DELETE_IN_PROGRESS ]; then
            aws cloudformation delete-stack --stack-name "$STACK_NAME"
          fi
          aws cloudformation wait stack-delete-complete --stack-name "$STACK_NAME"

      - name: Remove frontend
        env:
          PREVIEW_BUCKET: ${{ vars.PREVIEW_BUCKET }}
          PREVIEW_DISTRIBUTION_ID: ${{ vars.PREVIEW_DISTRIBUTION_ID }}
        run: |
          set -euo pipefail
          aws s3 rm "s3://${PREVIEW_BUCKET}/pr-${PR_NUMBER}/" --recursive --only-show-errors
          aws cloudfront create-invalidation --distribution-id "$PREVIEW_DISTRIBUTION_ID" \
            --paths "/pr-${PR_NUMBER}/*" --query 'Invalidation.Id' --output text

      - name: Update comment
        env:
          REASON: ${{ github.event.action == 'closed' && 'PR closed' || 'label removed' }}
        run: |
          set -euo pipefail
          id=$(gh api --paginate "repos/${GITHUB_REPOSITORY}/issues/${PR_NUMBER}/comments" \
            --jq "[.[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"${COMMENT_MARKER}\")))][0].id // empty" | head -n1)
          if [ -z "$id" ]; then
            exit 0
          fi
          body="${COMMENT_MARKER}
          ### PR preview

          Torn down (${REASON}). Add the \`preview\` label to deploy a new one."
          gh api -X PATCH "repos/${GITHUB_REPOSITORY}/issues/comments/${id}" -f body="$body" >/dev/null
