name: Deploy ETL Dataset

on:
  push:
    branches: [main]
    paths:
      - 'ETL_VERSION'
  workflow_dispatch:
    inputs:
      force:
        description: 'Re-restore even if the environment is already on this version'
        required: false
        default: false
        type: boolean
    # Uncomment the environment input below when sandbox/prod are ready.
    #   environment:
    #     description: 'Target environment'
    #     required: true
    #     default: dev
    #     type: choice
    #     options:
    #       - dev
    #       # - sandbox
    #       # - prod

# Prevent simultaneous deploys to the same environment.
# cancel-in-progress: false ensures a running restore is never interrupted
# mid-swap; the newer run queues and starts after the current one finishes.
concurrency:
  group: deploy-dataset
  cancel-in-progress: false

permissions:
  contents: read
  id-token: write

jobs:
  # Copy the release's plot assets into the frontend bucket BEFORE the dataset
  # that links to them goes live. Both jobs key off the same pin: ETL_VERSION
  # resolves to runs/<ETL_VERSION>/release.json, whose nlm_ckn_tag names the
  # asset prefix. One workflow, two jobs, one version input — the ordering
  # guarantee without merging the scripts. See docs/static-asset-copy-plan.md.
  #
  # A failure here deliberately blocks the dataset job: swapping the database to
  # a version whose plots were never copied would ship broken links.
  deploy-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 30  # the copy is ~2,850 server-side S3 copies, 1-3 min
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          # Role created by the nlm-ckn-iac account-setup (bootstrap) stack
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/nlm-ckn-github-actions
          aws-region: us-east-1

      - name: Deploy plot assets to dev
        run: ./scripts/app/deploy-assets.sh dev
      # Uncomment below (and comment out the step above) once sandbox/prod are deployed.
      # NOTE: deploy-assets.sh refuses `sandbox` until the ALB->Lambda handler can
      # serve pre-gzipped objects (work item 6 in docs/static-asset-copy-plan.md).
      # - name: Deploy plot assets
      #   run: ./scripts/app/deploy-assets.sh ${{ inputs.environment || 'dev' }}

  deploy-dataset:
    needs: deploy-assets
    runs-on: ubuntu-latest
    timeout-minutes: 110  # matches the 90-min SSM timeout plus overhead
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5  # v4
        with:
          persist-credentials: false

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a  # v4
        with:
          # Role created by the nlm-ckn-iac account-setup (bootstrap) stack
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/nlm-ckn-github-actions
          aws-region: us-east-1

      # FORCE is read from the environment rather than interpolated into the
      # command line: a workflow expression inside run: is substituted before
      # the shell sees it.
      - name: Deploy dataset to dev
        env:
          FORCE: ${{ inputs.force }}
        run: |
          if [ "$FORCE" = "true" ]; then
            ./scripts/app/deploy-dataset.sh --force dev
          else
            ./scripts/app/deploy-dataset.sh dev
          fi
      # Uncomment below (and comment out the step above) once sandbox/prod are deployed.
      # - name: Deploy dataset
      #   run: ./scripts/app/deploy-dataset.sh ${{ inputs.environment || 'dev' }}
