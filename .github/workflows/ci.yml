name: CI

on:
  pull_request_target:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

# Cancel in-progress runs for the same PR or branch
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  id-token: write  # Required for GitHub OIDC (deploy jobs)

jobs:
  # Detect which parts of the codebase changed to skip unnecessary tests
  detect-changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.filter.outputs.frontend }}
      backend: ${{ steps.filter.outputs.backend }}
      e2e: ${{ steps.filter.outputs.e2e }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            # ci.yml defines the jobs these filters gate, so an edit to it
            # runs them; otherwise a CI-only change cannot test itself.
            frontend:
              - '.github/workflows/ci.yml'
              - 'react/src/**'
              - 'react/public/**'
              - 'react/package.json'
              - 'react/package-lock.json'
              - 'react/biome.json'
              - 'react/jsconfig.json'
            backend:
              - '.github/workflows/ci.yml'
              - 'api/**'
              - 'core/**'
              - 'arango_api/**'
              - 'requirements.txt'
              - 'manage.py'
              - 'Dockerfile'
              - '.dockerignore'
              # The version endpoint reports pinned_etl_version from the
              # ETL_VERSION file baked into the image, so an ETL bump has to
              # rebuild the backend or dev keeps advertising the previous
              # dataset while serving the new one.
              - 'ETL_VERSION'
              # The backend reads its search tiers from the collection maps.
              - 'react/src/assets/nlm-ckn-collection-maps.json'
            e2e:
              - '.github/workflows/ci.yml'
              - 'react/src/**'
              - 'react/public/**'
              # A dependency bump is the change most likely to break at
              # runtime, which only e2e catches.
              - 'react/package.json'
              - 'react/package-lock.json'
              - 'react/tests/e2e/**'
              - 'react/playwright.config.ts'
              - 'api/**'
              - 'core/**'
              - 'arango_api/**'

  # Permission check for fork PRs - only runs when backend changes are detected
  # For PRs from forks, this job will fail until a maintainer re-runs it
  check-fork-permissions:
    needs: detect-changes
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request_target' && needs.detect-changes.outputs.backend == 'true'
    steps:
      - name: Get User Permission
        id: checkAccess
        uses: actions-cool/check-user-permission@v2
        with:
          require: write
          username: ${{ github.triggering_actor }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check User Permission
        if: steps.checkAccess.outputs.require-result == 'false'
        run: |
          echo "${{ github.triggering_actor }} does not have permissions on this repo."
          echo "Current permission level is ${{ steps.checkAccess.outputs.user-permission }}"
          echo "Job originally triggered by ${{ github.actor }}"
          exit 1

  # Frontend linting with Biome - auto-fixes and pushes on PRs
  frontend-lint:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 2

      - name: Check if last commit was auto-fix
        id: check-autofix
        run: |
          if git log -1 --pretty=%B | grep -q "\[biome auto-fix\]"; then
            echo "skip=true" >> $GITHUB_OUTPUT
          else
            echo "skip=false" >> $GITHUB_OUTPUT
          fi
        working-directory: .

      - name: Setup Node.js
        if: steps.check-autofix.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'react/package-lock.json'

      - name: Cache node_modules
        if: steps.check-autofix.outputs.skip != 'true'
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: react/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('react/package-lock.json') }}

      - name: Install dependencies
        if: steps.check-autofix.outputs.skip != 'true' && steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Biome auto-fix
        if: steps.check-autofix.outputs.skip != 'true'
        run: npm run fix
        continue-on-error: true

      - name: Check for changes and push
        if: steps.check-autofix.outputs.skip != 'true' && github.event_name == 'pull_request_target' && github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd ..
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          if [[ -n $(git status --porcelain react/) ]]; then
            echo "Biome made changes, committing and pushing..."
            git add react/
            git commit -m "style: auto-fix linting issues [biome auto-fix]"
            git push origin HEAD:${{ github.head_ref }}
            echo "Changes pushed. The workflow will re-run on the new commit."
          else
            echo "No changes needed"
          fi

      - name: Run Biome check
        if: steps.check-autofix.outputs.skip != 'true'
        run: npm run check

  # Frontend unit tests with Jest
  frontend-unit-tests:
    needs: detect-changes
    if: needs.detect-changes.outputs.frontend == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'react/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: react/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('react/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Run Jest tests
        run: npm test -- --watchAll=false --coverage --ci
        env:
          CI: true

      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage
          path: react/coverage
          if-no-files-found: ignore
          retention-days: 7

  # Frontend E2E tests with Playwright
  frontend-e2e:
    needs: detect-changes
    if: needs.detect-changes.outputs.e2e == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: react
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'react/package-lock.json'

      - name: Cache node_modules
        uses: actions/cache@v4
        id: cache-node-modules
        with:
          path: react/node_modules
          key: ${{ runner.os }}-node-modules-${{ hashFiles('react/package-lock.json') }}

      - name: Install dependencies
        if: steps.cache-node-modules.outputs.cache-hit != 'true'
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(npm list @playwright/test --json | jq -r '.dependencies["@playwright/test"].version')" >> $GITHUB_OUTPUT

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        id: cache-playwright
        with:
          path: ~/.cache/ms-playwright
          key: ${{ runner.os }}-playwright-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright browsers
        if: steps.cache-playwright.outputs.cache-hit != 'true'
        run: npx playwright install --with-deps chromium

      - name: Install Playwright system dependencies
        if: steps.cache-playwright.outputs.cache-hit == 'true'
        run: npx playwright install-deps chromium

      - name: Run Playwright E2E tests
        run: npm run test:e2e
        env:
          CI: true
          PORT: '3000'
          BROWSER: 'none'

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: react/playwright-report
          if-no-files-found: ignore
          retention-days: 7

      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: react/test-results
          if-no-files-found: ignore
          retention-days: 7

  # Backend unit tests - no database required
  backend-unit-tests:
    needs: [detect-changes, check-fork-permissions]
    if: |
      always() &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.check-fork-permissions.result == 'success' || needs.check-fork-permissions.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Django unit tests
        run: python manage.py test --exclude-tag=integration --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          SECRET_KEY: ${{ secrets.SECRET_KEY }}
          ARANGO_TEST_MODE: 'true'

  # Backend integration tests - requires ArangoDB
  backend-integration-tests:
    needs: [detect-changes, check-fork-permissions]
    if: |
      always() &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.check-fork-permissions.result == 'success' || needs.check-fork-permissions.result == 'skipped')
    runs-on: ubuntu-latest
    services:
      arangodb:
        image: arangodb:latest
        ports:
          - 8530:8529
        env:
          ARANGO_ROOT_PASSWORD: test
        options: >-
          --health-cmd "arangosh --server.password test --javascript.execute-string 'db._version()'"
          --health-interval 10s
          --health-timeout 10s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'
          cache-dependency-path: 'requirements.txt'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Wait for ArangoDB to be ready
        run: |
          for i in {1..30}; do
            if curl -s http://localhost:8530/_api/version > /dev/null; then
              echo "ArangoDB is ready"
              break
            fi
            echo "Waiting for ArangoDB... attempt $i of 30"
            sleep 2
          done

      - name: Run Django integration tests
        run: python manage.py test --tag=integration --verbosity=2
        env:
          DJANGO_SETTINGS_MODULE: core.settings
          ARANGO_TEST_MODE: 'true'
          SECRET_KEY: ${{ secrets.SECRET_KEY }}

  # Backend Docker build - verify the image builds successfully
  backend-docker-build:
    needs: [detect-changes, check-fork-permissions]
    if: |
      always() &&
      (needs.detect-changes.outputs.backend == 'true' || github.event_name == 'workflow_dispatch') &&
      (needs.check-fork-permissions.result == 'success' || needs.check-fork-permissions.result == 'skipped')
    runs-on: ubuntu-latest
    steps:
      # pull_request_target defaults to the base branch, so without an explicit
      # ref this job builds main and passes regardless of what the PR did to the
      # Dockerfile or requirements.txt. Building the head means the Dockerfile
      # and requirements.txt run as PR-controlled code, so this job takes the
      # same fork-permission gate as the other backend jobs and drops the
      # checkout credentials the build would otherwise have access to.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false

      - name: Build Docker image
        run: docker build -t nlm-ckn-backend .

  # Final status check - used for branch protection rules
  # Note: !cancelled() prevents orphaned status reports when workflow is cancelled
  # due to new commits triggering cancel-in-progress
  ci-passed:
    runs-on: ubuntu-latest
    needs:
      - detect-changes
      - check-fork-permissions
      - frontend-lint
      - frontend-unit-tests
      - frontend-e2e
      - backend-unit-tests
      - backend-integration-tests
      - backend-docker-build
    if: ${{ always() && !cancelled() }}
    outputs:
      success: ${{ steps.set-output.outputs.passed }}
    steps:
      - name: Check all jobs passed
        id: set-output
        run: |
          echo "Fork permissions: ${{ needs.check-fork-permissions.result }}"
          echo "Frontend lint: ${{ needs.frontend-lint.result }}"
          echo "Frontend unit tests: ${{ needs.frontend-unit-tests.result }}"
          echo "Frontend E2E: ${{ needs.frontend-e2e.result }}"
          echo "Backend unit tests: ${{ needs.backend-unit-tests.result }}"
          echo "Backend integration tests: ${{ needs.backend-integration-tests.result }}"
          echo "Backend Docker build: ${{ needs.backend-docker-build.result }}"

          # Check if any job failed - skipped jobs are OK due to path filtering
          # A failed detect-changes leaves every filter output unset, which
          # skips the test jobs and would otherwise read as a pass.
          if [[ "${{ needs.detect-changes.result }}" == "failure" ]] || \
             [[ "${{ needs.check-fork-permissions.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-lint.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.frontend-e2e.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-unit-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-integration-tests.result }}" == "failure" ]] || \
             [[ "${{ needs.backend-docker-build.result }}" == "failure" ]]; then
            echo "One or more jobs failed"
            echo "passed=false" >> $GITHUB_OUTPUT
            exit 1
          fi

          echo "All checks passed"
          echo "passed=true" >> $GITHUB_OUTPUT

  # ============================================================================
  # Auto-approve ETL bumps - a PR that only rewrites the ETL_VERSION line is
  # approved once CI passes. The ruleset does not dismiss stale approvals, so
  # this check runs without waiting on CI and withdraws an earlier approval as
  # soon as a push makes the PR anything more than that one line.
  # ============================================================================

  etl-bump-check:
    if: github.event_name == 'pull_request_target'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    outputs:
      qualifies: ${{ steps.check.outputs.qualifies }}
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      REPO: ${{ github.repository }}
      PR: ${{ github.event.pull_request.number }}
      HEAD_REPO: ${{ github.event.pull_request.head.repo.full_name }}
      SHA: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Check the diff is one ETL_VERSION line
        id: check
        run: |
          # Snapshot the bot's approvals before reading the head, so an approval
          # a newer commit's run gives later is never among those withdrawn.
          approvals=$(gh api "repos/$REPO/pulls/$PR/reviews" --paginate \
            --jq '.[] | select(.user.login == "github-actions[bot]" and .state == "APPROVED") | .id')
          # The files endpoint reads the PR's current head, so only trust it
          # when that head is still the commit this run was triggered for.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          files=$(gh api "repos/$REPO/pulls/$PR/files?per_page=100")
          qualifies=false
          if [[ "$head" == "$SHA" && "$HEAD_REPO" == "$REPO" ]] && jq -e 'length == 1 and .[0].filename == "ETL_VERSION"
              and .[0].status == "modified" and .[0].additions == 1 and .[0].deletions == 1' \
              <<<"$files" >/dev/null; then
            added=$(jq -r '.[0].patch' <<<"$files" | grep '^+' | cut -c2-)
            if [[ "$added" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
              qualifies=true
            fi
          fi
          echo "qualifies=$qualifies" >> "$GITHUB_OUTPUT"

          # Only the run for the current head withdraws, and only the approvals
          # snapshotted above.
          if [[ "$head" == "$SHA" && "$qualifies" != true ]]; then
            for id in $approvals; do
              gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$id/dismissals" \
                -f event=DISMISS -f message="No longer a one-line ETL_VERSION bump."
            done
          fi

  auto-approve-etl-bump:
    needs: [etl-bump-check, ci-passed]
    if: ${{ !cancelled() && needs.etl-bump-check.outputs.qualifies == 'true' && needs.ci-passed.outputs.success == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - name: Approve the checked commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          # A push since the check gets its own run; never approve a superseded commit.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [[ "$head" != "$SHA" ]]; then
            echo "Head moved to $head; the run for it decides."
            exit 0
          fi
          review=$(gh api -X POST "repos/$REPO/pulls/$PR/reviews" -f commit_id="$SHA" \
            -f event=APPROVE -f body="One-line ETL_VERSION bump and CI passed." --jq .id)
          # A push between the check above and the POST could otherwise leave
          # an approval on a superseded commit; withdraw this one if so.
          head=$(gh api "repos/$REPO/pulls/$PR" --jq .head.sha)
          if [[ "$head" != "$SHA" ]]; then
            gh api -X PUT "repos/$REPO/pulls/$PR/reviews/$review/dismissals" \
              -f event=DISMISS -f message="Head moved to $head after this approval."
          fi

  # ============================================================================
  # Deploy jobs - only run on push to main after all tests pass
  # ============================================================================

  deploy-frontend:
    needs: [detect-changes, frontend-lint, frontend-unit-tests, frontend-e2e]
    if: |
      always() &&
      needs.frontend-lint.result != 'failure' &&
      needs.frontend-unit-tests.result != 'failure' &&
      needs.frontend-e2e.result != 'failure' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.detect-changes.outputs.frontend == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role created by the nlm-ckn-iac account-setup (bootstrap) stack
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/nlm-ckn-github-actions
          aws-region: us-east-1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: 'react/package-lock.json'

      - name: Deploy frontend to dev
        run: ./scripts/app/deploy-frontend.sh dev

  deploy-backend:
    needs: [detect-changes, backend-unit-tests, backend-integration-tests, backend-docker-build]
    if: |
      always() &&
      needs.backend-unit-tests.result != 'failure' &&
      needs.backend-integration-tests.result != 'failure' &&
      needs.backend-docker-build.result != 'failure' &&
      (
        github.event_name == 'workflow_dispatch' ||
        (github.event_name == 'push' && needs.detect-changes.outputs.backend == 'true')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          # Role created by the nlm-ckn-iac account-setup (bootstrap) stack
          role-to-assume: arn:aws:iam::${{ vars.AWS_ACCOUNT_ID }}:role/nlm-ckn-github-actions
          aws-region: us-east-1

      - name: Deploy backend to dev
        run: ./scripts/app/deploy-backend.sh dev
