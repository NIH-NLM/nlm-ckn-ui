# shellcheck shell=bash disable=SC2034
# ==============================================================================
# int — integration environment (its own AWS account)
# ==============================================================================
# Read by scripts/env-config.sh; see its header for how values are resolved.
# Each value is a fixed name or "ssm:<parameter name>" read in THIS account,
# except the account/access keys below, which must be literal (they are needed
# before the role is assumed).
# Prefer ssm: for anything that changes when infrastructure is replaced (the
# ArangoDB instance id does on every resize).
# ==============================================================================

# ── Account and access ───────────────────────────────────────────────────────
CKN_ACCOUNT_ID=""                    # TODO: int account id
CKN_ROLE_NAME="nlm_aws_devops"
CKN_REGION="us-east-1"

# ── ArangoDB (deploy-dataset.sh) ─────────────────────────────────────────────
CKN_ARANGO_INSTANCE_ID=""            # TODO: instance id, or ssm:<param holding it>
CKN_DATASET_VERSION_PARAM=""         # TODO: NAME of the SSM parameter the deploy writes the live version to
CKN_ARANGO_ROOT_SECRET=""            # TODO: Secrets Manager id of the ArangoDB root password
# Read-only backend user. Leave both empty if the backend connects as root.
CKN_ARANGO_RO_USER_PARAM=""          # SSM parameter NAME holding the username
CKN_ARANGO_RO_PASSWORD_SECRET=""     # Secrets Manager id of its password

# ── Frontend (deploy-assets.sh) ──────────────────────────────────────────────
CKN_FRONTEND_BUCKET=""               # TODO: frontend S3 bucket
CKN_CF_DIST_ID=""                    # optional: empty skips CloudFront invalidation
CKN_FRONTEND_URL=""                  # optional: empty skips the edge check and post-restore smoke test

# ── Sources in springbok (952291113202), read cross-account ──────────────────
# Fixed names: springbok's SSM parameters are not readable from this account.
# Their bucket policies must grant CKN_ROLE_NAME read, and the ArangoDB
# instance role must be able to read the dataset bucket (it downloads the dump).
CKN_ARANGO_BUCKET="nlm-ckn-arangodb-data-952291113202"
CKN_STATIC_ASSETS_BUCKET="nlm-ckn-static-assets-952291113202"
